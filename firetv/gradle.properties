org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# androidx.webkit is the only library in the project, and it is here for one
# line: clearing the X-Requested-With header that names this package. Google's
# sign-in refuses a browser that announces itself as an app, and that header is
# how the framework WebView announces itself.
android.useAndroidX=true
android.nonTransitiveRClass=true
