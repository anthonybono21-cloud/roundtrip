# Builds the Fire TV app and drops the apk at the root of the site, so the
# Fire Stick can fetch it from a short address that never changes:
#
#   anthonybono21-cloud.github.io/roundtrip/rt.apk
#
# This environment cannot build it: dl.google.com is blocked from a project
# session, so there is no Android SDK there. A runner has one already.
name: Fire TV app

on:
  push:
    branches: [main]
    paths:
      - 'firetv/**'
      - '.github/workflows/firetv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firetv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 is not used: it asks the sdkmanager for the obsolete
      # `tools` package, which no longer exists in Google's repository, and
      # dies. The runner image already carries the SDK, so take it and add the
      # two pieces this build needs.
      - name: Android SDK
        run: |
          set -eu
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The run number becomes the version code, so each build installs over
      # the last one instead of being refused as a downgrade.
      - name: Build the apk
        working-directory: firetv
        run: >
          gradle --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.${{ github.run_number }}
          assembleRelease

      - name: Check it came out signed
        working-directory: firetv
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: roundtrip-firetv-apk
          path: firetv/app/build/outputs/apk/release/app-release.apk

      # A checkout is pinned to the commit that triggered it, so by the time
      # the apk is built main may have moved — and then `git pull --rebase`
      # tries to rebase a new binary over a different new binary and stops on
      # a conflict it can never resolve. That is what killed build 8.
      #
      # There is no merge to do here: whatever was just built is the apk, and
      # an older one is only ever in the way. So the commit is made fresh
      # against whatever main is at this second, with this run's apk dropped
      # on top, and remade if main moves again while we are pushing.
      - name: Publish it beside the site
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          cp firetv/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/rt.apk"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/rt.apk" rt.apk
            git add rt.apk
            if git diff --cached --quiet; then
              echo "apk unchanged"
              exit 0
            fi
            git commit -m "Fire TV app build ${{ github.run_number }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under attempt $attempt; rebuilding the commit"
            sleep $((attempt * 3))
          done
          echo "could not publish the apk after five attempts" >&2
          exit 1
