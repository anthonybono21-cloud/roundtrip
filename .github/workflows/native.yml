# Builds the Roundtrip apps.
#
# Android is built all the way to an installable APK, attached to the run and
# dropped at the root of the site as phone.apk.
#
# The Apple targets are compiled here, iPhone, iPad and Mac, which catches
# every mistake a build can catch but stops short of anything installable: a
# signed build needs the certificate on Anthony's MacBook, which builds and
# installs them directly. native/BUILD.md has those commands.

name: Apps

on:
  push:
    # Work branches build too: an app that only gets compiled once it is on
    # main is an app nobody finds out is broken until it is too late.
    branches: [main, 'claude/**', 'codex/**']
    paths:
      - 'native/**'
      - 'index.html'
      - 'search.js'
      - 'menu.js'
      - 'tv.js'
      - 'satellite-earth.js'
      - 'space-scene.js'
      - 'journey.js'
      - 'cameras.json'
      - 'assets/**'
      - 'vendor/**'
      - 'clouds/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'index.html'
      - 'search.js'
      - 'menu.js'
      - 'tv.js'
      - 'satellite-earth.js'
      - 'space-scene.js'
      - 'journey.js'
      - 'cameras.json'
      - 'assets/**'
      - 'vendor/**'
      - 'clouds/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-android@v3 is not used: it asks the sdkmanager for the obsolete
      # `tools` package, which no longer exists in Google's repository, and
      # dies on it. The runner image already carries the SDK, so take that and
      # add the two pieces this build needs. (Same conclusion the Fire TV
      # build reached; see .github/workflows/firetv.yml.)
      - name: Android SDK
        run: |
          set -eu
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Install
        working-directory: native
        run: npm ci

      - name: Copy the web app into the shell
        working-directory: native
        run: npm run sync-web

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Build the APK
        working-directory: native/android
        run: >
          ./gradlew --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.${{ github.run_number }}
          assembleDebug

      # The build falls back to a throwaway debug key if the shared sideload
      # one cannot be read, and a throwaway key means the next build will not
      # install over this one. Better to find that out here than on the phone.
      - name: Check it is signed with the sideload key
        run: |
          set -eu
          APK=native/android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi 'CN=Roundtrip\|roundtrip' /tmp/certs.txt \
            || echo "::warning::apk is not signed with the shared sideload key"

      - uses: actions/upload-artifact@v4
        with:
          name: roundtrip-android-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An artifact needs a GitHub account and a zip to get at. A file beside
      # the site is a link you open on the phone you want it on. The Fire TV
      # app does the same with rt.apk.
      # A checkout is pinned to the commit that triggered it, so when a second
      # change lands while this one is building, the old `git pull --rebase`
      # here tried to rebase one new apk over a different new apk, stopped on a
      # conflict nothing can resolve, and exited. Build 20 compiled, signed and
      # verified and was then thrown away, and the run read as a build failure.
      #
      # There is no merge to do: whatever this run built is the apk, and an
      # older one is only ever in the way. So rebuild the commit on top of
      # wherever main has got to and try again. The Fire TV publish hit the
      # same thing and took the same shape; see .github/workflows/firetv.yml.
      - name: Publish it beside the site
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          cp native/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/phone.apk"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/phone.apk" phone.apk
            git add phone.apk
            if git diff --cached --quiet; then
              echo "apk unchanged"
              exit 0
            fi
            git commit -m "Android app build ${{ github.run_number }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under attempt $attempt; rebuilding the commit"
            sleep $((attempt * 3))
          done
          echo "could not publish the apk after five attempts" >&2
          exit 1

  apple:
    name: iPhone, iPad and Mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install
        working-directory: native
        run: npm ci

      - name: Copy the web app into the shell
        working-directory: native
        run: npm run sync-web

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync ios

      # Compiled unsigned, for a simulator. The signed build that actually
      # goes on a phone happens on the MacBook, which has the developer
      # account; see native/BUILD.md. This is here to catch a Swift or
      # project mistake on the push that made it, not to produce anything
      # installable.
      - name: Compile for iPhone and iPad
        working-directory: native/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile for Mac
        working-directory: native/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO \
            build
