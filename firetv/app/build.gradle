plugins { id 'com.android.application' }

// Worked out before the android block on purpose. Written inline as
// `versionCode (expr).toString().toInteger()`, Groovy reads it as a call to
// versionCode(expr) and then chains onto its return value, which is null.
def vCode = ((project.findProperty('versionCode') ?: '1') as String) as Integer
def vName = (project.findProperty('versionName') ?: "1.0.$vCode") as String

android {
  namespace 'com.roundtrip.tv'
  compileSdk 34

  defaultConfig {
    applicationId 'com.roundtrip.tv'
    // Fire OS 5 is Android 5.1, which is the oldest Fire Stick still in use.
    minSdk 22
    targetSdk 34
    // CI passes the run number so each build installs over the last one.
    versionCode vCode
    versionName vName
  }

  // Signed with a key that is in this repository on purpose. It protects
  // nothing: this app is sideloaded onto one Fire Stick and is never going
  // near a store. What a fixed key buys is that every build installs over the
  // last one instead of being refused as a different app.
  signingConfigs {
    sideload {
      storeFile file('../roundtrip-sideload.jks')
      storePassword 'roundtrip'
      keyAlias 'roundtrip'
      keyPassword 'roundtrip'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.sideload
    }
    debug { signingConfig signingConfigs.sideload }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint { abortOnError false }
}

// One library, for one line. Google refuses its sign-in to a browser that
// announces itself as an app, and the framework WebView announces itself with
// an X-Requested-With header carrying this package name. Nothing in the
// platform API can clear that header; androidx.webkit can.
dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
