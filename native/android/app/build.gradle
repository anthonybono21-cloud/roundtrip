apply plugin: 'com.android.application'

// CI passes the run number in, so a newer build is never refused as a
// downgrade. Worked out up here rather than inline in defaultConfig: Groovy
// reads `versionCode (x).toString()` as a call to versionCode(x) followed by
// toString() on what it returned, which is nothing, and the build dies on
// "Value is null".
def rtVersionCode = ((project.findProperty('versionCode') ?: '1') as String).toInteger()
def rtVersionName = (project.findProperty('versionName') ?: "1.0.${rtVersionCode}").toString()

// Sideload signing.
//
// Android refuses to install a build over one signed by a different key, and
// a debug key is regenerated on every machine, so without this each update
// means deleting the app first. The Fire TV app in this repository already
// keeps a key for exactly that reason and declares its credentials once, in
// firetv/app/build.gradle. They are read out of that file here rather than
// copied, so there is one key and one place it is written down, and the two
// apps cannot drift apart. Neither app is going near a store: the key is in
// the repository on purpose and protects nothing.
def sideloadKey = rootProject.file('../../firetv/roundtrip-sideload.jks')
def sideloadFrom = rootProject.file('../../firetv/app/build.gradle')
def sideload = [:]
if (sideloadFrom.exists()) {
    sideloadFrom.eachLine { line ->
        def m = (line =~ /^\s*(storePassword|keyAlias|keyPassword)\s+'([^']*)'/)
        if (m.find()) sideload[m.group(1)] = m.group(2)
    }
}
def canSign = sideloadKey.exists() &&
    ['storePassword', 'keyAlias', 'keyPassword'].every { sideload.containsKey(it) }
if (!canSign) {
    logger.lifecycle('Roundtrip: no sideload key found, falling back to debug signing')
}

android {
    namespace "com.anthonybono.roundtrip"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.anthonybono.roundtrip"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rtVersionCode
        versionName rtVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // No compileOptions here on purpose: capacitor.build.gradle, applied at
    // the bottom of this file, sets Java 21 and would override anything set
    // above it. MapLibre is built against 17 and is happy on 21.
    if (canSign) {
        signingConfigs {
            sideload {
                storeFile sideloadKey
                storePassword sideload['storePassword']
                keyAlias sideload['keyAlias']
                keyPassword sideload['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSign) signingConfig signingConfigs.sideload
        }
        debug {
            if (canSign) signingConfig signingConfigs.sideload
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    // MapLibre Native: the map behind the app's map button. Open source, no
    // API key, no account — the imagery it draws is the same free Esri layer
    // the globe's descent already uses.
    implementation "org.maplibre.gl:android-sdk:$maplibreVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
